<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回放与时间轴 · 复杂系统模拟仿真平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="container">
    <h1 class="page-title">回放与时间轴</h1>
    <p class="page-sub">拖动时间轴回放任意时间步的个体快照；点击画布上的个体即可<strong>追踪轨迹</strong>，支持多选并用颜色区分。</p>

    <div class="card">
      <div class="row between">
        <div class="row">
          <select id="runSelect" style="max-width:420px"></select>
          <button class="btn small" id="refreshBtn">刷新</button>
        </div>
        <div class="row gap-6">
          <button class="btn primary" id="playBtn">▶ 播放</button>
          <span class="pill" id="stepLabel">第 0 步</span>
        </div>
      </div>
      <input type="range" class="timeline" id="timeline" min="0" max="0" value="0" step="1">
      <div class="row between muted small">
        <span id="t0">0</span><span id="t1">0</span>
      </div>
    </div>

    <div class="grid grid-4" id="statTiles"></div>

    <div class="grid grid-track">
      <div class="card">
        <div class="canvas-wrap"><canvas id="canvas" class="pickable" title="点击个体以追踪 / 取消追踪"></canvas></div>
        <div class="legend" id="legend"></div>
        <p class="muted small" style="margin:10px 0 0">
          <strong>点击画布中的个体</strong>即可追踪（连续点击可多选，再次点击取消）；
          <span style="color:#2ecc71">绿圈＝中途出现</span>，<span style="color:#e74c3c">红 ✕＝中途消失（驶离 / 死亡 / 移除）</span>，环形世界越过边界时折线自动断开。
        </p>
      </div>

      <div class="card">
        <div class="row between">
          <h3 style="margin:0">个体轨迹追踪</h3>
          <div class="row gap-6">
            <label class="muted small"><input type="checkbox" id="showTracks" checked> 显示轨迹</label>
            <button class="btn small" id="clearTracksBtn">全部清除</button>
          </div>
        </div>
        <div class="row gap-6" style="margin-top:10px">
          <input id="trackIdInput" placeholder="输入个体 id 后回车，如 rb00042" style="flex:1">
          <button class="btn small" id="trackIdBtn">追踪</button>
        </div>
        <div id="trackChips" class="track-chips" style="margin-top:12px"></div>
        <div id="trackDetail" class="track-detail" style="margin-top:14px"></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/replay.js"></script>
</body>
</html>
