<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回放与时间轴 · 复杂系统模拟仿真平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="container">
    <h1 class="page-title">回放与时间轴</h1>
    <p class="page-sub">拖动时间轴，快速回放任意时间步的个体快照（按时间步分片存储）。</p>

    <div class="card">
      <div class="row between">
        <div class="row">
          <select id="runSelect" style="max-width:420px"></select>
          <button class="btn small" id="refreshBtn">刷新</button>
        </div>
        <div class="row gap-6">
          <button class="btn primary" id="playBtn">▶ 播放</button>
          <span class="pill" id="stepLabel">第 0 步</span>
        </div>
      </div>
      <input type="range" class="timeline" id="timeline" min="0" max="0" value="0" step="1">
      <div class="row between muted small">
        <span id="t0">0</span><span id="t1">0</span>
      </div>
    </div>

    <div class="grid grid-4" id="statTiles"></div>

    <div class="card">
      <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
      <div class="legend" id="legend"></div>
      <p class="muted small" style="margin:8px 0 0">提示：点击画布上的任意个体即可追踪（再次点击其他个体可同时追踪多个，颜色区分）；折线在个体消失处终止并以 × 标记，在环形道路/环面跨越边界时自动断开。</p>
    </div>

    <div class="card">
      <h2>个体轨迹追踪</h2>
      <div class="row between" style="margin-bottom:10px">
        <div class="row gap-6" id="trackList"></div>
        <div class="row gap-6">
          <input id="trackIdInput" placeholder="输入个体 id（逗号分隔多个）后回车…" style="width:260px">
          <button class="btn small" id="trackClearBtn">全部清除</button>
        </div>
      </div>
      <div class="notice" id="trackNotice" style="display:none"></div>
      <div id="trackSequence"></div>
      <p class="muted small" style="margin:8px 0 0">轨迹严格按个体 id 关联每一步快照——相邻位置、相同状态或个体已消失都不会串线；折线覆盖第 0 步至当前步，时间轴位置即轨迹终点。轨迹精度取决于快照保存间隔。</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/track.js"></script>
  <script src="/js/replay.js"></script>
</body>
</html>
